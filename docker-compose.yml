services:
  db-dev:
    image: postgres:18
    container_name: mori-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEV_DB_USER}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
      POSTGRES_DB: ${DEV_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - mori-db-dev-data:/var/lib/postgresql

  db-test:
    image: postgres:18
    container_name: mori-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: ${TEST_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - mori-db-test-data:/var/lib/postgresql

volumes:
  mori-db-dev-data:
  mori-db-test-data: